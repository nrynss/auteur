[project]
name = "foleyflow"
version = "0.1.0"
description = "AI post-production copilot: B2-backed projects, Genblaze-orchestrated Foley, QA, and provenance"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.35.0",
    "fal-client>=1.0.0",
    "fastapi>=0.115.0",
    "genblaze-core>=0.3.0,<0.4",
    "genblaze-s3>=0.3.0,<0.4",
    "google-genai>=1.0,<2",
    "httpx>=0.27.0",
    "numpy>=2.5.1",
    "python-dotenv>=1.2.2",
    "soundfile>=0.14.0",
    "tzdata>=2026.3",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
foley = "foley.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foley", "src/foleyflow"]

[tool.pytest.ini_options]
pythonpath = ["src"]
