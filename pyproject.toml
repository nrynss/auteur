[project]
name = "foleyflow"
version = "0.1.0"
description = "AI post-production copilot: B2-backed projects, Genblaze-orchestrated Foley, QA, and provenance"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.35.0",
    "fal-client>=1.0.0",
    "fastapi>=0.115.0",
    "genblaze-core>=0.3.8,<0.4",
    "genblaze-elevenlabs>=0.3,<0.4",
    "genblaze-s3>=0.3.0,<0.4",
    "google-genai>=1.0,<2",
    "httpx>=0.27.0",
    "numpy>=2.5.1",
    "openai>=1.0,<3",
    "python-dotenv>=1.2.2",
    "soundfile>=0.14.0",
    "tzdata>=2026.3",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
# `auteur` is the command; `foleyflow` is kept as an alias on purpose. Every
# script in scripts/, every README example and every runbook says `foleyflow`,
# and an operator mid-incident should not learn about a rename from
# `command not found`. Both resolve to the same entry point.
auteur = "foleyflow.cli:main"
foleyflow = "foleyflow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foleyflow"]

[tool.pytest.ini_options]
pythonpath = ["src"]
