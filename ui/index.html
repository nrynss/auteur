<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Set the theme before first paint so there is no light-flash for dark
         users (tokens live in ui/src/lib/theme.css). Best-effort; the app's
         ThemeToggle writes the same key. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("foleyflow-theme");
          if (t === "dark" || t === "light") {
            document.documentElement.dataset.theme = t;
          }
        } catch (e) {}
      })();
    </script>
    <!-- Inline SVG favicon: no asset file to lose or serve. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230E1113'/%3E%3Cpath d='M30 55 L45 25 L60 70 L75 40' stroke='%234FB3A6' stroke-width='10' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>FoleyFlow — Control room</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
