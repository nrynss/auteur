<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Set the theme before first paint so there is no light-flash for dark
         users (tokens live in ui/src/lib/theme.css). Best-effort; the app's
         ThemeToggle writes the same key. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("foleyflow-theme");
          if (t === "dark" || t === "light") {
            document.documentElement.dataset.theme = t;
          }
        } catch (e) {}
      })();
    </script>
    <!-- Brand surface: the <title> and the favicon link are injected at
         build time by vite.config.ts from VITE_BRAND_* env, so a deployment
         can rebrand without a patch. Defaults are today's values. -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
