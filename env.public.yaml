# Non-secret Cloud Run environment. Commit this file; never put credentials here.
# Secrets are mounted from Secret Manager via --set-secrets (see README / scripts/deploy.sh).
#
# B2_APPLICATION_KEY, B2_KEY_ID, GEMINI_API_KEY, FOLEYFLOW_SFX_WORKER_TOKEN
# must NOT appear in this file.

B2_ENDPOINT_URL: "https://s3.us-east-005.backblazeb2.com"
B2_REGION: "us-east-005"
B2_BUCKET: "hackathon-nryn"
B2_PREFIX: "foleyflow"
FOLEYFLOW_CACHE_BACKEND: "b2"
FOLEYFLOW_SFX_WORKER_URL: "https://sfx.nryn.dev"

# The deployed service generates hero foley on the paid tier. providers.toml
# ships `active = "test"` (the self-hosted MOSS worker) because that is the
# right default for local work and the offline suite; the env var wins, and
# this is where the deployed service opts into paid ElevenLabs via Genblaze.
# Without this line a deploy silently ships on the free testing tier.
# `paid` falls back to fal on provider error; it needs the
# foleyflow-elevenlabs-api-key secret, which deploy.sh mounts when present.
FOLEYFLOW_SFX_TIER: "paid"

# Stamped at deploy time by scripts/deploy.sh (or append manually):
# FOLEYFLOW_GIT_SHA: "..."
# FOLEYFLOW_BUILD_TIME: "..."
