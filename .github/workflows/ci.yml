name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Require ffmpeg on PATH
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
          ffprobe -version

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      # Runs the full suite and asserts handoff.md / SPEC.md match runtime
      # passed + skipped exactly (so a silent ffmpeg skip increase fails CI).
      - name: Docs count + suite
        run: uv run --frozen python scripts/check_test_count.py

  ui-build:
    # Unit 7.6: the Svelte SPA must type-check against the API contract and
    # build. Contract drift surfaces here as a svelte-check failure, and a
    # tracked built asset fails the last step (decision 8).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      # The TS types are generated from the FastAPI schema, which comes from
      # the app itself — no server, no network.
      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Emit OpenAPI schema
        run: uv run --frozen python scripts/emit_openapi.py --out ui/openapi.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Generate types from the schema
        working-directory: ui
        run: npm run typegen

      - name: Type-check the UI
        working-directory: ui
        run: npm run check

      - name: Run UI tests
        working-directory: ui
        run: npm test

      - name: Build the UI
        working-directory: ui
        run: npm run build

      # Task 19 acceptance: the default build keeps the brand, and a build
      # with the branding variables set renders NO occurrence of the default
      # name anywhere in the served UI. Vite statically replaces
      # import.meta.env.VITE_BRAND_* at build time, so this is a real check
      # of the bundle, not of the source.
      - name: Default build keeps the brand
        working-directory: ui
        run: |
          grep -q '<title>FoleyFlow — Control room</title>' \
            ../src/foleyflow/api/static/index.html
          grep -rnq "FoleyFlow" ../src/foleyflow/api/static/

      - name: Rebranded build renders no default name
        working-directory: ui
        run: |
          VITE_BRAND_NAME="KinoPost" \
          VITE_BRAND_TITLE_TEMPLATE="{name} · {page}" \
          VITE_BRAND_FAVICON="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231721A3'/%3E%3C/svg%3E" \
          npm run build
          if grep -rn "FoleyFlow" ../src/foleyflow/api/static/; then
            echo "error: default brand name leaked into the rebranded build" >&2
            exit 1
          fi
          grep -q '<title>KinoPost · Control room</title>' \
            ../src/foleyflow/api/static/index.html
          grep -rnq "KinoPost" ../src/foleyflow/api/static/

      - name: Confirm no built assets are tracked
        run: |
          tracked=$(git ls-files src/foleyflow/api/static/)
          if [ -n "$tracked" ]; then
            echo "error: built SPA assets are tracked in git: $tracked" >&2
            exit 1
          fi

  docker-build:
    # Unit 7.6's acceptance criterion — the image serves the SPA with no Node
    # in it — is otherwise verified by nobody. A full docker build on every PR
    # is slow, so this runs on master pushes (every one is a deploy candidate)
    # and on demand via workflow_dispatch; it is the pre-deploy gate.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: |
          docker build \
            --build-arg FOLEYFLOW_GIT_SHA="$GITHUB_SHA" \
            --build-arg FOLEYFLOW_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t foleyflow:ci .

      - name: Start the container
        run: |
          docker run -d --name foleyflow-ci -p 8099:8080 foleyflow:ci
          for i in $(seq 1 45); do
            curl -fsS http://localhost:8099/api/v1/health >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "container did not become ready" >&2
          docker logs foleyflow-ci >&2 || true
          exit 1

      - name: Assert the SPA is served, not the unbuilt page
        run: |
          body=$(curl -fsS http://localhost:8099/)
          echo "$body" | grep -q '<div id="app">' || {
            echo "error: GET / did not return the built SPA mount point" >&2
            exit 1
          }
          if echo "$body" | grep -qi 'not built'; then
            echo "error: GET / returned the 'UI not built' page" >&2
            exit 1
          fi

      - name: Assert a deep link returns the SPA
        run: |
          curl -fsS \
            http://localhost:8099/projects/proj_01KYJD1RKETS3KTX5HA3H5JPDQ/timeline \
            | grep -q '<div id="app">'

      - name: Assert no Node ships in the runtime image
        run: |
          if docker exec foleyflow-ci sh -c 'command -v node'; then
            echo "error: node is present in the runtime image" >&2
            exit 1
          fi
          if docker exec foleyflow-ci sh -c 'command -v npm'; then
            echo "error: npm is present in the runtime image" >&2
            exit 1
          fi
          echo "no node/npm in the runtime image (expected)"

      - name: Clean up
        if: always()
        run: docker rm -f foleyflow-ci || true
