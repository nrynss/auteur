# Data-driven route table for src/foley/routing.py.
#
# Loaded once (functools.lru_cache) by routing.py. Editing routes/keywords
# here never requires touching code. `categories` is an ORDERED list — the
# first category whose keyword list has a word-boundary match
# (foley.keywords.has_word) against the lowercased event name wins. `default`
# is the fallback when nothing matches.
#
# Keyword notes:
# - has_word does a PREFIX match at a left word boundary ("wood" matches
#   "wooden"; "door" matches "doorway"). Keep keywords specific enough to
#   avoid false positives — e.g. "match" was deliberately left out of
#   impact_strike because it would prefix-match "matchbox" in "paper tearing
#   from matchbox", which must stay in the default category. "strike" alone
#   already covers "match strike".
# - Keyword coverage here mirrors the "Routing keyword coverage" row of the
#   Numeric defaults (locked) table in build_spec.md, which is authoritative.

categories:
  - name: ambience
    endpoint: cassetteai/sound-effects-generator
    keywords: [wind]

  - name: footsteps
    endpoint: cassetteai/sound-effects-generator
    keywords: [footstep, walking, tread, boot]

  - name: door_creak
    endpoint: fal-ai/elevenlabs/sound-effects/v2
    keywords: [door, gate, latch, hinge, creak, squeak]

  - name: impact_strike
    endpoint: fal-ai/mmaudio-v2/text-to-audio
    keywords: [strike, ignite, glass, shatter, impact, break]

default:
  name: default
  endpoint: cassetteai/sound-effects-generator
